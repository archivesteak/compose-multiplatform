pluginManagement {
    plugins {
        id 'org.jetbrains.kotlin.multiplatform' version 'KOTLIN_VERSION_PLACEHOLDER'
        id 'org.jetbrains.kotlin.plugin.compose' version 'KOTLIN_VERSION_PLACEHOLDER'
        id 'io.github.archivesteak.compose' version 'COMPOSE_GRADLE_PLUGIN_VERSION_PLACEHOLDER'
        id 'com.android.kotlin.multiplatform.library' version 'AGP_VERSION_PLACEHOLDER'
    }
    repositories {
        exclusiveContent {
            forRepository { mavenLocal() }
            filter { includeGroupByRegex("io\\.github\\.archivesteak(\\..*)?") }
        }
        gradlePluginPortal()
        mavenCentral()
        google()
        maven {
            url 'https://packages.jetbrains.team/maven/p/cmp/dev'
        }
    }
}
dependencyResolutionManagement {
    repositories {
        mavenCentral()
        google()
        maven {
            url 'https://packages.jetbrains.team/maven/p/cmp/dev'
        }
        exclusiveContent {
            forRepository { mavenLocal() }
            filter { includeGroupByRegex("io\\.github\\.archivesteak(\\..*)?") }
        }
    }
}
rootProject.name = "mpp"