name: Test Gradle plugin against validated fork artifacts

on:
  workflow_dispatch:
    inputs:
      contract_ref:
        description: Exact compose-multiplatform commit containing this workflow and requirements
        required: true
        type: string
      source_ref:
        description: Exact compose-multiplatform source commit to build and test
        required: true
        type: string
      core_repository:
        description: Exact owner/repository containing the core producer workflows
        required: true
        type: string
        default: archivesteak/compose-multiplatform-core
      core_contract_ref:
        description: Full commit SHA containing the core workflows, merger, and requirements
        required: true
        type: string
      core_ref:
        description: Full source commit SHA pinned by the core Maven requirements
        required: true
        type: string
      core_windows_run_id:
        description: Successful run containing the maven-windows artifact
        required: true
        type: string
      core_apple_run_id:
        description: Successful run containing the maven-apple artifact
        required: true
        type: string
      core_web_run_id:
        description: Successful run containing the maven-web-android artifact
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  prepare-resources:
    uses: ./.github/workflows/publish-resources.yml
    with:
      contract_ref: ${{ inputs.contract_ref }}
      source_ref: ${{ inputs.source_ref }}
      core_repository: ${{ inputs.core_repository }}
      core_contract_ref: ${{ inputs.core_contract_ref }}
      core_ref: ${{ inputs.core_ref }}
      core_windows_run_id: ${{ inputs.core_windows_run_id }}
      core_apple_run_id: ${{ inputs.core_apple_run_id }}
      core_web_run_id: ${{ inputs.core_web_run_id }}
    secrets:
      core_artifacts_token: ${{ secrets.CORE_ARTIFACTS_TOKEN }}

  test-gradle-plugin:
    needs: prepare-resources
    permissions:
      actions: read
      contents: read
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15-xlarge, windows-2022]
        gradle: [9.3.1, 9.5.0]
        agp: [9.1.1, 9.2.0]
        exclude:
          - gradle: 9.3.1
            agp: 9.2.0
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out exact plugin source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_ref }}
          persist-credentials: false

      - name: Verify exact source revision
        shell: bash
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          resolved=$(git rev-parse HEAD)
          if [ "$resolved" != "$SOURCE_REF" ]; then
            echo "plugin checkout resolved to $resolved, expected $SOURCE_REF"
            exit 1
          fi
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Download validated core and resources repository
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: validated-resources-maven
          path: ${{ runner.temp }}/validated-resources

      - name: Set up JDK 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-read-only: true
          gradle-home-cache-excludes: |
            caches/jars-9
            caches/transforms-3

      - name: Assemble and inspect the publishable plugin JAR
        shell: bash
        working-directory: gradle-plugins
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            ./gradlew.bat "-Dmaven.repo.local=$RUNNER_TEMP/validated-resources/repository" \
              --no-daemon --stacktrace assemble :compose:checkJar
          else
            ./gradlew "-Dmaven.repo.local=$RUNNER_TEMP/validated-resources/repository" \
              --no-daemon --stacktrace assemble :compose:checkJar
          fi

      - name: Run unit and supported Gradle/AGP integration tests
        shell: bash
        working-directory: gradle-plugins
        env:
          INTEGRATION_TASK: :compose:test-Gradle(${{ matrix.gradle }})-Agp(${{ matrix.agp }})
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            ./gradlew.bat "-Dmaven.repo.local=$RUNNER_TEMP/validated-resources/repository" \
              --no-daemon --stacktrace --continue \
              :preview-rpc:test :compose:test "$INTEGRATION_TASK"
          else
            ./gradlew "-Dmaven.repo.local=$RUNNER_TEMP/validated-resources/repository" \
              --no-daemon --stacktrace --continue \
              :preview-rpc:test :compose:test "$INTEGRATION_TASK"
          fi

      - name: Upload test reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: Test-Reports-${{ matrix.os }}-Gradle-${{ matrix.gradle }}-Agp-${{ matrix.agp }}
          path: gradle-plugins/compose/build/reports
          if-no-files-found: warn
          retention-days: 5

      - name: Print test summary
        shell: bash
        if: always()
        run: |
          summary_dir=gradle-plugins/compose/build/test-summary
          if [ ! -d "$summary_dir" ]; then
            exit 0
          fi
          while IFS= read -r -d '' summary; do
            echo "## $(basename "$summary")" >> "$GITHUB_STEP_SUMMARY"
            cat "$summary" >> "$GITHUB_STEP_SUMMARY"
          done < <(find "$summary_dir" -name '*.md' -print0)
