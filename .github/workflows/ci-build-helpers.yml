name: Build-Helpers Publish to Maven Local
on:
  pull_request:
    paths:
      - 'ci/build-helpers/**'
      - '.github/workflows/ci-build-helpers.yml'
  push:
    branches:
      - master
    paths:
      - 'ci/build-helpers/**'
      - '.github/workflows/ci-build-helpers.yml'

jobs:
  build-helpers-publish:
    permissions:
      contents: read
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup JDK 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: 'jetbrains'
          java-version: '21'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to Maven Local
        shell: bash
        working-directory: ci/build-helpers
        run: |
          FORK_M2="$RUNNER_TEMP/build-helpers-m2"
          mkdir -p "$FORK_M2"
          ./gradlew "-Dmaven.repo.local=$FORK_M2" --no-daemon --stacktrace publishToMavenLocal
